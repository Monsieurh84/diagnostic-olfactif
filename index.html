<meta property="og:description" content="Le quiz parfum qui recommande, convertit et enrichit votre CRM. Shopify & WordPress.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3c3 4 6 7.5 6 11a6 6 0 01-12 0c0-3.5 3-7 6-11z' fill='%230F5C5A'/%3E%3C/svg%3E"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Shell = outil de démo neutre (graphite + sarcelle). La boutique dans le cadre a SA charte, indépendante du thème du lecteur. */
:root{
  --bg:#F2F3F1;--panel:#FFFFFF;--fg:#17191C;--muted:#5E656B;--line:#DADDDA;--accent:#0F5C5A;--accent-ink:#FFFFFF;--soft:#E4ECEA;
  --good:#2E7D4F;--warn:#A86412;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111315;--panel:#191C1F;--fg:#E7EAE8;--muted:#9AA3A6;--line:#2C3135;--accent:#5FB3AE;--accent-ink:#0B1413;--soft:#1E2A29;--good:#6BC08E;--warn:#E0A355;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111315;--panel:#191C1F;--fg:#E7EAE8;--muted:#9AA3A6;--line:#2C3135;--accent:#5FB3AE;--accent-ink:#0B1413;--soft:#1E2A29;--good:#6BC08E;--warn:#E0A355;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
/* ---------- barre de démo ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:15px;font-weight:600;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:12px}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl>label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--fg);font-weight:500}
.integ{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.integ code{font-family:var(--f-mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);padding:2px 6px;border-radius:4px;color:var(--fg)}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.frame-top{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.frame-top i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.frame-top span{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- BOUTIQUE (charte du client) ---------- */
.store{--s-bg:#FBFAF8;--s-ink:#1E1B18;--s-muted:#7A726B;--s-line:#E6E1DB;--s-accent:#8C6A43;--s-card:#F3F0EC;--s-btn:#1E1B18;--s-btn-ink:#FBFAF8;
  --s-display:"Bodoni Moda",Georgia,serif;--s-body:"Jost",system-ui,sans-serif;--s-radius:0px;--s-track:.14em;
  background:var(--s-bg);color:var(--s-ink);font-family:var(--s-body);font-weight:400;position:relative;color-scheme:light}
.store[data-charte="nuit"]{--s-bg:#0E0D12;--s-ink:#EDE6D6;--s-muted:#9A927F;--s-line:#2A2732;--s-accent:#C9A15B;--s-card:#17151D;--s-btn:#C9A15B;--s-btn-ink:#0E0D12;
  --s-display:"Italiana",Georgia,serif;--s-body:"Manrope",system-ui,sans-serif;--s-radius:2px;--s-track:.22em;color-scheme:dark}
.store[data-charte="atelier"]{--s-bg:#EEF0EA;--s-ink:#23302A;--s-muted:#66756B;--s-line:#D3D9CF;--s-accent:#3F6B55;--s-card:#E2E7DE;--s-btn:#3F6B55;--s-btn-ink:#F4F6F1;
  --s-display:"DM Serif Display",Georgia,serif;--s-body:"Work Sans",system-ui,sans-serif;--s-radius:10px;--s-track:.08em}
.store h1,.store h2,.store h3,.store .logo{font-family:var(--s-display);font-weight:400;text-wrap:balance;margin:0}
.s-eyebrow{font-size:11px;letter-spacing:var(--s-track);text-transform:uppercase;color:var(--s-accent)}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s-btn);color:var(--s-btn-ink);border:1px solid var(--s-btn);padding:12px 22px;border-radius:var(--s-radius);cursor:pointer;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--s-body)}
.s-btn.ghost{background:transparent;color:var(--s-ink);border-color:var(--s-ink)}
.s-btn.small{padding:8px 12px;font-size:11.5px}
.s-link{background:none;border:0;color:var(--s-muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;padding:4px}
/* Shopify / Dawn */
.sh-annonce{background:var(--s-btn);color:var(--s-btn-ink);text-align:center;font-size:12px;letter-spacing:.05em;padding:8px 16px}
.sh-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:18px 20px;border-bottom:1px solid var(--s-line)}
.sh-head .logo{font-size:24px;letter-spacing:var(--s-track);text-transform:uppercase;text-align:center}
.icons{display:flex;gap:14px;justify-content:flex-end;align-items:center}
.ico{width:22px;height:22px;display:inline-grid;place-items:center;position:relative;background:none;border:0;padding:0;cursor:pointer;color:var(--s-ink)}
.ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4}
.ico .n{position:absolute;right:-7px;bottom:-5px;background:var(--s-accent);color:var(--s-bg);font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-ui)}
.sh-nav{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;padding:12px 16px;font-size:13px;color:var(--s-muted);border-bottom:1px solid var(--s-line)}
.sh-nav b{color:var(--s-ink);font-weight:500;border-bottom:1px solid var(--s-accent)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:48px 32px;border-bottom:1px solid var(--s-line)}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.05;margin-block:10px 14px}
.hero p{color:var(--s-muted);max-width:44ch;margin:0 0 22px}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--s-muted)}
.hero-art{display:flex;justify-content:center;align-items:flex-end;gap:14px;min-height:200px}
.coll{padding:36px 24px}
.coll-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.coll-head h2{font-size:28px}
.coll-head select{background:var(--s-bg);border:1px solid var(--s-line);color:var(--s-ink);padding:8px 10px;border-radius:var(--s-radius);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 18px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0}
.card .vis{background:var(--s-card);aspect-ratio:4/5;max-width:100%;border-radius:var(--s-radius);display:grid;place-items:end center;padding-bottom:14%;position:relative;overflow:hidden}
.card h3{font-size:18px;margin-top:6px}
.card .fam{font-size:12px;color:var(--s-muted)}
.card .price{font-size:14px;font-variant-numeric:tabular-nums}
.match{position:absolute;top:10px;left:10px;background:var(--s-bg);color:var(--s-ink);border:1px solid var(--s-accent);font-size:11px;padding:3px 8px;border-radius:999px;font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.match.top{background:var(--s-accent);color:var(--s-bg)}
.card-act{margin-top:4px}
.s-foot{border-top:1px solid var(--s-line);padding:24px;font-size:12px;color:var(--s-muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
/* flacon */
.bottle{position:relative;width:46%;max-width:110px;aspect-ratio:3/4}
.bottle .cap{position:absolute;left:34%;right:34%;top:0;height:20%;background:var(--s-ink);border-radius:2px 2px 0 0;opacity:.88}
.bottle .neck{position:absolute;left:42%;right:42%;top:19%;height:6%;background:var(--s-ink);opacity:.5}
.bottle .glass{position:absolute;left:0;right:0;top:24%;bottom:0;border:1px solid rgba(0,0,0,.12);background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.12) 30%,transparent 31%),var(--juice);border-radius:4px}
.bottle .lab{position:absolute;left:18%;right:18%;top:52%;height:22%;background:rgba(255,255,255,.82);display:grid;place-items:center;font-family:var(--s-display);font-size:9px;color:#1E1B18;letter-spacing:.08em;text-transform:uppercase;text-align:center;line-height:1.1;padding:2px}
.hero-art .bottle{width:84px}
.hero-art .bottle:nth-child(2){width:110px}
/* WooCommerce */
.wc-top{display:flex;justify-content:flex-end;gap:16px;padding:6px 20px;font-size:12px;color:var(--s-muted);border-bottom:1px solid var(--s-line)}
.wc-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px}
.wc-head .logo{font-size:26px}
.wc-nav{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.wc-nav b{font-weight:500;color:var(--s-accent)}
.wc-cart{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--s-line);padding:8px 12px;border-radius:var(--s-radius);background:none;cursor:pointer;color:var(--s-ink);font-variant-numeric:tabular-nums}
.wc-crumb{padding:12px 20px;font-size:12px;color:var(--s-muted);background:var(--s-card)}
.wc-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;padding:28px 20px}
.wc-side{display:flex;flex-direction:column;gap:22px}
.widget h4{font-family:var(--s-display);font-weight:400;font-size:17px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--s-line)}
.widget ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--s-muted)}
.widget ul li{display:flex;justify-content:space-between}
.wc-quiz{background:var(--s-card);padding:18px;border-radius:var(--s-radius);display:flex;flex-direction:column;gap:10px}
.wc-quiz p{margin:0;font-size:13px;color:var(--s-muted)}
.wc-banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--s-line);padding:22px;border-radius:var(--s-radius);margin-bottom:26px}
.wc-banner h2{font-size:24px;margin-block:6px}
.wc-banner p{margin:0;color:var(--s-muted);font-size:13px}
.wc-main h1{font-size:34px;margin-bottom:4px}
.wc-count{font-size:12px;color:var(--s-muted);margin-bottom:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.wc-layout .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.wc-layout .card{text-align:center;align-items:center}
.wc-layout .card .vis{width:100%}
/* lanceur flottant */
.launcher{position:fixed;right:max(16px,calc((100vw - 1180px)/2 + 16px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:10px;background:var(--s-btn);color:var(--s-btn-ink);border:0;border-radius:999px;padding:12px 18px 12px 12px;box-shadow:0 8px 28px rgba(0,0,0,.22);cursor:pointer;font-family:var(--s-body);font-size:13px}
.launcher .dot{width:30px;height:30px;border-radius:50%;background:var(--s-btn-ink);color:var(--s-btn);display:grid;place-items:center}
.launcher .dot svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.launcher small{display:block;opacity:.75;font-size:11px}
/* ---------- MODULE QUIZ ---------- */
.qz{position:fixed;inset:0;z-index:60;background:var(--s-bg);color:var(--s-ink);display:flex;flex-direction:column;font-family:var(--s-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.qz-top{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--s-line)}
.qz-top .logo{font-family:var(--s-display);font-size:16px;letter-spacing:var(--s-track);text-transform:uppercase;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qz-prog{height:2px;background:var(--s-line);position:relative}
.qz-prog i{position:absolute;inset:0 auto 0 0;background:var(--s-accent);transition:width .35s ease}
.qz-body{flex:1;overflow-y:auto;padding:28px 18px 24px}
.qz-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.qz-step{font-size:12px;color:var(--s-muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.qz h2{font-size:clamp(26px,4vw,38px);line-height:1.1}
.qz-sub{color:var(--s-muted);margin:-6px 0 0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:1px solid var(--s-line);background:transparent;color:var(--s-ink);border-radius:var(--s-radius);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,background .15s;min-width:0}
.opt:hover{border-color:var(--s-ink)}
.opt[aria-pressed="true"]{border-color:var(--s-accent);background:var(--s-card);box-shadow:inset 0 0 0 1px var(--s-accent)}
.opt b{font-weight:500;font-size:15px}
.opt span{font-size:12.5px;color:var(--s-muted)}
.opt.amb{padding:0;overflow:hidden}
.opt.amb .sw{aspect-ratio:16/9;max-width:100%;width:100%}
.opt.amb .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--s-line);background:transparent;color:var(--s-ink);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--s-btn);color:var(--s-btn-ink);border-color:var(--s-btn)}
.chip[disabled]{opacity:.4;cursor:not-allowed}
.qz-field{display:flex;flex-direction:column;gap:6px}
.qz-field label{font-size:12px;color:var(--s-muted)}
.qz-field input{background:transparent;border:0;border-bottom:1px solid var(--s-line);padding:10px 2px;font-size:16px;color:var(--s-ink);border-radius:0}
.qz-field input:focus{outline:none;border-bottom-color:var(--s-accent)}
.qz-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--s-line)}
.qz-foot .hint{font-size:12px;color:var(--s-muted)}
.s-btn[disabled]{opacity:.35;cursor:not-allowed}
/* gate */
.gate{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.teaser{background:var(--s-card);border-radius:var(--s-radius);padding:22px;position:relative;overflow:hidden}
.teaser .blur{filter:blur(6px);user-select:none;display:flex;flex-direction:column;gap:10px}
.teaser .lock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.teaser .lock b{font-family:var(--s-display);font-size:22px;font-weight:400;display:block}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.perks li{display:flex;gap:10px}
.perks li::before{content:"";flex:0 0 6px;height:6px;margin-top:8px;background:var(--s-accent);border-radius:50%}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--s-muted)}
.consent input{margin-top:3px;accent-color:var(--s-accent)}
.err{color:#B3261E;font-size:12px;min-height:16px}
.store[data-charte="nuit"] .err{color:#F08A80}
/* résultat */
.res-head{display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;align-items:center}
.res-head canvas{width:100%;max-width:240px;aspect-ratio:1;height:auto}
.res-head h2{font-size:clamp(28px,4vw,42px)}
.res-head p{color:var(--s-muted);margin:8px 0 0;max-width:52ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-size:11.5px;border:1px solid var(--s-line);padding:3px 9px;border-radius:999px;color:var(--s-muted)}
.recos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.reco{border:1px solid var(--s-line);border-radius:var(--s-radius);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.reco.first{border-color:var(--s-accent)}
.reco .vis{background:var(--s-card);aspect-ratio:1;max-width:100%;border-radius:var(--s-radius);display:grid;place-items:end center;padding-bottom:10%;position:relative}
.reco h3{font-size:20px}
.why{font-size:12.5px;color:var(--s-muted);margin:0}
.why b{color:var(--s-ink);font-weight:500}
.meter{height:4px;background:var(--s-line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--s-accent)}
.reco-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13px}
.coffret{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--s-card);padding:18px 20px;border-radius:var(--s-radius)}
.coffret h3{font-size:20px}
.coffret p{margin:4px 0 0;font-size:13px;color:var(--s-muted)}
.res-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.promo{border:1px dashed var(--s-accent);padding:12px 16px;border-radius:var(--s-radius);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.promo code{font-family:var(--f-mono);font-size:14px;letter-spacing:.1em;color:var(--s-accent)}
/* panier */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);z-index:70;background:var(--s-bg);color:var(--s-ink);border-left:1px solid var(--s-line);box-shadow:-10px 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;font-family:var(--s-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--s-line)}
.drawer-h h3{font-family:var(--s-display);font-weight:400;font-size:20px;margin:0}

/* ---------- moteur de score ---------- */
function compute(){
  const a=S.a;let v=[0,0,0,0,0,0];let intPref=2,budget=1e9;
  const add=(vec,w)=>{v=v.map((x,i)=>x+(vec[i]||0)*w)};
  const g=(qid)=>Q.find(q=>q.id===qid);
  if(a.moment){const o=g('moment').o.find(o=>o.id===a.moment);add(o.v,1);intPref=o.int;}
  if(a.ambiance){add(g('ambiance').o.find(o=>o.id===a.ambiance).v,2);}
  if(a.actuel&&a.actuel.style){add(g('actuel').o.find(o=>o.id===a.actuel.style).v,.8);}
  const liked=a.aime||[];liked.forEach(n=>{const i=FAM.indexOf(NOTEFAM[n]);if(i>=0)v[i]+=.6;});
  if(a.sillage)intPref=Math.round((intPref+ +a.sillage*2)/3);
  if(a.budget)budget=g('budget').o.find(o=>o.id===a.budget).max;
  const avoid=(a.evite||[]).filter(x=>x!=='none').flatMap(k=>AVOIDMAP[k]||[]);
  const norm=x=>Math.sqrt(x.reduce((s,y)=>s+y*y,0))||1;
  const scored=P.map(p=>{
    const cos=v.reduce((s,x,i)=>s+x*p.vec[i],0)/(norm(v)*norm(p.vec));
    const lk=p.notes.filter(n=>liked.includes(n));
    const av=p.notes.filter(n=>avoid.includes(n));
    let r=cos*72+lk.length*10-av.length*32-Math.abs(intPref-p.int)*6-(p.price>budget?18:0);
    const pct=Math.max(38,Math.min(98,Math.round(46+r*.62)));
    return {p,pct,lk,av,over:p.price>budget,cos};
  }).sort((x,y)=>y.pct-x.pct||x.p.price-y.p.price);
  const order=v.map((x,i)=>[x,FAM[i]]).sort((x,y)=>y[0]-x[0]);
  const max=order[0][0]||1;
  return {v:v.map(x=>x/max),top:order[0][1],second:order[1][1],scored,map:Object.fromEntries(scored.map(s=>[s.p.id,s])),intPref,budget};

function drawRadar(){
  const c=$('#radar');if(!c)return;const ctx=c.getContext('2d');const cs=getComputedStyle($('#store'));
  const ink=cs.getPropertyValue('--s-ink').trim(),line=cs.getPropertyValue('--s-line').trim(),acc=cs.getPropertyValue('--s-accent').trim(),muted=cs.getPropertyValue('--s-muted').trim();
  const W=480,cx=W/2,cy=W/2,R=150;ctx.clearRect(0,0,W,W);
  const ang=i=>-Math.PI/2+i*2*Math.PI/6;
  ctx.strokeStyle=line;ctx.lineWidth=1.5;
  [.33,.66,1].forEach(k=>{ctx.beginPath();for(let i=0;i<6;i++){const x=cx+Math.cos(ang(i))*R*k,y=cy+Math.sin(ang(i))*R*k;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke()});
  for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(ang(i))*R,cy+Math.sin(ang(i))*R);ctx.stroke()}
  const v=S.res.v.map(x=>Math.max(.08,x));
  ctx.beginPath();v.forEach((x,i)=>{const px=cx+Math.cos(ang(i))*R*x,py=cy+Math.sin(ang(i))*R*x;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.closePath();
  ctx.globalAlpha=.22;ctx.fillStyle=acc;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=acc;ctx.lineWidth=3;ctx.stroke();
  v.forEach((x,i)=>{ctx.beginPath();ctx.arc(cx+Math.cos(ang(i))*R*x,cy+Math.sin(ang(i))*R*x,5,0,7);ctx.fillStyle=acc;ctx.fill()});
  ctx.font='500 22px '+cs.getPropertyValue('--s-body');ctx.textAlign='center';ctx.textBaseline='middle';
  FAM.forEach((f,i)=>{ctx.fillStyle=(f===S.res.top)?ink:muted;ctx.fillText(FAMNAME[f],cx+Math.cos(ang(i))*(R+44),cy+Math.sin(ang(i))*(R+30))});
}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.view){S.view=t.dataset.view;renderAll();return;}
  if(t.dataset.pf){S.pf=t.dataset.pf;renderAll();return;}
  if(t.dataset.ch){S.ch=t.dataset.ch;renderAll();return;}
  if(t.hasAttribute('data-open')||t.id==='launcher'){openQuiz();return;}
  if(t.id==='qz-close'||t.id==='qz-close2'){if(S.screen==='q'&&S.started&&!S.res)track('quiz_abandon',{question:S.step+1});S.quiz=false;renderStore();return;}
  if(t.id==='qz-prev'||t.id==='qz-back'){if(S.screen==='gate'){S.screen='q';}else if(S.step>0)S.step--;renderStore();return;}
  if(t.id==='qz-next'){next();return;}
  if(t.dataset.q){S.a[t.dataset.q]=t.dataset.v;save();renderStore();setTimeout(next,220);return;}
  if(t.dataset.m){const q=Q.find(x=>x.id===t.dataset.m);let arr=(S.a[q.id]||[]).slice();const v=t.dataset.v;
    if(v==='none')arr=arr.includes('none')?[]:['none'];else{arr=arr.filter(x=>x!=='none');arr.includes(v)?arr=arr.filter(x=>x!==v):arr.length<q.max&&arr.push(v);}
    S.a[q.id]=arr;save();renderStore();return;}
  if(t.dataset.act){const nm=$('#actuel-nom');S.a.actuel={style:t.dataset.act,nom:nm?nm.value.trim():''};save();renderStore();return;}
  if(t.id==='g-send'){const em=$('#g-email').value.trim(),pr=$('#g-prenom').value.trim(),ok=$('#g-ok').checked;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){$('#g-err').textContent="Entrez une adresse e-mail valide, par exemple prenom@domaine.fr.";return;}
    if(!ok){$('#g-err').textContent="Cochez la case pour recevoir votre profil et votre code.";return;}
    S.email=em;S.prenom=pr||null;track('lead_captured',{email:em,prenom:pr,consentement:true,profil:S.res.top});S.screen='res';renderStore();return;}
  if(t.id==='g-skip'){track('lead_skipped',{profil:S.res.top});S.screen='res';renderStore();return;}
  if(t.id==='to-gate'){S.screen='gate';renderStore();return;}
  if(t.dataset.add){addToCart(t.dataset.add,t.dataset.src);return;}
  if(t.hasAttribute('data-coffret')){addToCart('coffret');return;}
  if(t.id==='see-store'){S.quiz=false;S.sort='match';track('view_sorted_catalog',{profil:S.res.top});renderStore();$('#grid')&&$('#grid').scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(t.id==='restart'){S.a={};S.step=0;S.res=null;S.screen='q';S.sort='feat';S.started=false;save();openQuiz();return;}
  if(t.id==='share'){const txt=`Mon profil olfactif chez ${STORES[S.ch].name} : ${FAMNAME[S.res.top]}, accent ${ADJ[S.res.second]}. Mes 3 parfums : ${S.res.scored.slice(0,3).map(s=>s.p.n).join(', ')}.`;
    track('profile_shared',{profil:S.res.top});try{navigator.clipboard.writeText(txt).then(()=>toast('Profil copié'),()=>toast(txt));}catch(err){toast(txt)}return;}
  if(t.id==='cart-btn'){S.drawer=true;renderStore();return;}
  if(t.id==='dr-close'){S.drawer=false;renderStore();return;}
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){S.sort=e.target.value;renderStore();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.drawer){S.drawer=false;renderStore();}else if(S.quiz){S.quiz=false;renderStore();}}});

function renderAll(){
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  document.querySelectorAll('[data-pf]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pf===S.pf));
  document.querySelectorAll('[data-ch]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ch===S.ch));
  $('#v-boutique').hidden=S.view!=='boutique';$('#v-data').hidden=S.view!=='data';$('#v-offre').hidden=S.view!=='offre';
  if(S.view!=='boutique'){S.quiz=false;S.drawer=false;}
  renderStore();
  if(S.view==='data')renderData();
  if(S.view==='offre')renderOffer();
  if(location.hash==='#donnees'&&S.view==='boutique'){}
}
const h=location.hash.replace('#','');if(h==='donnees')S.view='data';if(h==='offre')S.view='offre';
try{const u=new URLSearchParams(location.search);
  const pf=u.get('pf');if(pf==='woo'||pf==='wordpress'||pf==='woocommerce')S.pf='woo';if(pf==='shopify')S.pf='shopify';
  const ch=u.get('ch');if(STORES[ch])S.ch=ch;
  const vu=u.get('vue');if(vu==='donnees')S.view='data';if(vu==='offre')S.view='offre';
  if(u.get('offre')==='0'){const b=document.getElementById('tab-offre');if(b)b.remove();if(S.view==='offre')S.view='boutique';}
  renderAll();if(u.get('quiz')==='1'&&S.view==='boutique')openQuiz();
}catch(e){renderAll();}
})();
